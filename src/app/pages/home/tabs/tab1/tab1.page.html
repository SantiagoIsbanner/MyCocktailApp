<ion-header>
  <ion-toolbar>
    <ion-title>Bebida del Día</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content *ngIf="bebidaDelDia">
  <div class="bebida-container">
    <h2>{{ bebidaDelDia.nombre }}</h2>
    <img [src]="bebidaDelDia.imagen" alt="Imagen de la bebida">

    <ion-button (click)="abrirModal()">Preparación</ion-button>
  </div>
</ion-content>
